# Deploys the app to Cloudflare Pages on every push.
# The production branch (set in the Pages project) goes to https://storygames.pages.dev,
# every other branch gets its own preview address.
# Skips itself until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist
# (see docs/setup-cloudflare-supabase.md).
name: Deploy app to Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare is set up
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets aren't set yet; skipping the deploy. See docs/setup-cloudflare-supabase.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.ready.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm check

      - name: Build the app (stories come from R2, not from this build)
        if: steps.ready.outputs.ok == 'true'
        working-directory: packages/player
        env:
          VITE_CONTENT_MODE: published
          VITE_CONTENT_BASE: /content/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: pnpm exec vite build

      - name: Create the Pages project the first time
        if: steps.ready.outputs.ok == 'true'
        working-directory: packages/player
        run: npx --yes wrangler@4 pages project create storygames --production-branch="${{ github.event.repository.default_branch }}" || true

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: packages/player
        run: npx --yes wrangler@4 pages deploy --branch="${{ github.ref_name }}" --commit-dirty=true
