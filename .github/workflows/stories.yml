# Publish and manage stories from GitHub: Actions → "Stories" → Run workflow.
# Needs the R2 secrets (see docs/setup-cloudflare-supabase.md).
# Several stories can go in one run (separate them with commas or spaces). Runs happen one
# at a time so two can't edit the story lists at once; if you start a run while another is
# still waiting, GitHub cancels the older waiting one, so prefer one run with several stories.
name: Stories

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [status, publish, promote, rollback, unpublish]
        default: status
      story:
        description: "publish: story folder(s), e.g. fixtures/test-story, fixtures/night-watch. promote/unpublish: story id(s), e.g. the-last-ferry, hanas-night-watch. rollback: one story id"
        required: false
      channel:
        description: "Channel (publish defaults to staging; rollback/unpublish default to live)"
        type: choice
        options: [default, staging, live]
        default: default
      version:
        description: "rollback: the version to go back to (e.g. 1.0.0)"
        required: false

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: storygames-content
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ${{ inputs.action }} ${{ inputs.story }}
        env:
          ACTION: ${{ inputs.action }}
          STORY: ${{ inputs.story }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          run() { echo "::group::storygames $*"; node packages/cli/bin/storygames.mjs "$@"; echo "::endgroup::"; }
          channel=()
          [ "$CHANNEL" = "default" ] || channel=(--channel "$CHANNEL")

          if [ "$ACTION" = "status" ]; then
            node packages/cli/bin/storygames.mjs status
            exit 0
          fi
          read -r -a items <<< "${STORY//,/ }"
          [ "${#items[@]}" -gt 0 ] || { echo "::error::'story' is required for $ACTION"; exit 1; }

          case "$ACTION" in
            publish)
              for dir in "${items[@]}"; do
                case "$dir" in fixtures/*) lib=fixtures/library ;; *) lib=content/library ;; esac
                run publish "$dir" --library "$lib" "${channel[@]}"
              done ;;
            promote)
              for id in "${items[@]}"; do run promote "$id"; done ;;
            unpublish)
              [ "$CHANNEL" = "default" ] && channel=(--channel live)
              for id in "${items[@]}"; do run unpublish "$id" "${channel[@]}"; done ;;
            rollback)
              [ "${#items[@]}" -eq 1 ] || { echo "::error::rollback takes one story id"; exit 1; }
              [ -n "$VERSION" ] || { echo "::error::'version' is required for rollback"; exit 1; }
              run rollback "${items[0]}" --to "$VERSION" "${channel[@]}" ;;
          esac
          echo
          node packages/cli/bin/storygames.mjs status
