# Publish and manage stories from GitHub: Actions → "Stories" → Run workflow.
# Needs the R2 secrets (see docs/setup-cloudflare-supabase.md).
name: Stories

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [status, publish, promote, rollback, unpublish]
        default: status
      story:
        description: "publish: the story's folder (e.g. content/series/miras-journey/01-the-last-ferry). Others: the story id (e.g. the-last-ferry)"
        required: false
      channel:
        description: "Channel (publish defaults to staging; rollback/unpublish default to live)"
        type: choice
        options: [default, staging, live]
        default: default
      version:
        description: "rollback: the version to go back to (e.g. 1.0.0)"
        required: false

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: storygames-content
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ${{ inputs.action }} ${{ inputs.story }}
        env:
          ACTION: ${{ inputs.action }}
          STORY: ${{ inputs.story }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=("$ACTION")
          if [ "$ACTION" != "status" ]; then
            [ -n "$STORY" ] || { echo "::error::'story' is required for $ACTION"; exit 1; }
            args+=("$STORY")
          fi
          if [ "$ACTION" = "publish" ]; then
            case "$STORY" in fixtures/*) lib=fixtures/library ;; *) lib=content/library ;; esac
            args+=(--library "$lib")
          fi
          [ "$CHANNEL" = "default" ] || args+=(--channel "$CHANNEL")
          if [ "$ACTION" = "unpublish" ] && [ "$CHANNEL" = "default" ]; then args+=(--channel live); fi
          if [ "$ACTION" = "rollback" ]; then
            [ -n "$VERSION" ] || { echo "::error::'version' is required for rollback"; exit 1; }
            args+=(--to "$VERSION")
          fi
          node packages/cli/bin/storygames.mjs "${args[@]}"
